<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- torso / shoulders -->
  <path d="M 90 260 Q 150 230 210 260 L 230 400 L 70 400 Z" fill="#e8c9a8"/>
  <!-- neck -->
  <rect x="130" y="220" width="40" height="50" fill="#f1d3b3"/>
  <!-- hair back -->
  <ellipse cx="150" cy="150" rx="95" ry="110" fill="#5a3a22"/>
  <!-- face -->
  <ellipse cx="150" cy="160" rx="70" ry="85" fill="#f1d3b3"/>
  <!-- hair front -->
  <path d="M 65 130 Q 150 40 235 130 Q 235 90 150 75 Q 65 90 65 130 Z" fill="#5a3a22"/>
  <!-- eyebrows -->
  <rect x="100" y="140" width="30" height="6" rx="3" fill="#5a3a22"/>
  <rect x="170" y="140" width="30" height="6" rx="3" fill="#5a3a22"/>
  <!-- eyes (whites + pupils) -->
  <ellipse cx="115" cy="160" rx="14" ry="9" fill="white"/>
  <ellipse cx="185" cy="160" rx="14" ry="9" fill="white"/>
  <circle cx="115" cy="160" r="5" fill="#3b2a1a"/>
  <circle cx="185" cy="160" r="5" fill="#3b2a1a"/>
  <!-- nose -->
  <path d="M 150 165 L 145 195 Q 150 200 155 195 Z" fill="none" stroke="#c9a482" stroke-width="2"/>
  <!-- neutral mouth (covered by lips layer when selected) -->
  <path d="M 130 210 Q 150 218 170 210" fill="none" stroke="#c9917a" stroke-width="3" stroke-linecap="round"/>
</svg>
