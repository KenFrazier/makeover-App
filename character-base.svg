<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#f4c9a0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#4a2c17"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6a6c1"/>
      <stop offset="100%" stop-color="#e8789f"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4a488" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f4a488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft backdrop circle -->
  <circle cx="150" cy="185" r="145" fill="#fff5f8"/>

  <!-- shoulders / top -->
  <path d="M 75 270 Q 150 238 225 270 L 245 400 L 55 400 Z" fill="url(#top)"/>

  <!-- neck -->
  <path d="M 128 222 Q 150 236 172 222 L 172 262 Q 150 274 128 262 Z" fill="#eeb98f"/>

  <!-- hair back -->
  <ellipse cx="150" cy="150" rx="98" ry="115" fill="url(#hair)"/>

  <!-- face -->
  <ellipse cx="150" cy="160" rx="68" ry="82" fill="url(#skin)"/>

  <!-- cheeks -->
  <ellipse cx="112" cy="185" rx="18" ry="12" fill="url(#cheek)"/>
  <ellipse cx="188" cy="185" rx="18" ry="12" fill="url(#cheek)"/>

  <!-- hair front / fringe -->
  <path d="M 58 135 Q 150 20 242 135 Q 235 80 150 68 Q 65 80 58 135 Z" fill="url(#hair)"/>
  <path d="M 70 120 Q 60 190 78 235 Q 58 170 70 120 Z" fill="url(#hair)"/>
  <path d="M 230 120 Q 240 190 222 235 Q 242 170 230 120 Z" fill="url(#hair)"/>

  <!-- eyebrows -->
  <path d="M 100 143 Q 115 133 132 141" stroke="#4a2c17" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 168 141 Q 185 133 200 143" stroke="#4a2c17" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M 100 160 Q 115 150 132 160 Q 115 168 100 160 Z" fill="white"/>
  <path d="M 168 160 Q 185 150 200 160 Q 185 168 168 160 Z" fill="white"/>
  <circle cx="116" cy="160" r="6" fill="#4a2c17"/>
  <circle cx="184" cy="160" r="6" fill="#4a2c17"/>
  <path d="M 100 160 Q 115 150 132 160" stroke="#2a1a0f" stroke-width="2" fill="none"/>
  <path d="M 168 160 Q 185 150 200 160" stroke="#2a1a0f" stroke-width="2" fill="none"/>

  <!-- nose -->
  <path d="M 150 168 Q 146 190 150 196 Q 154 190 150 168" fill="none" stroke="#dba57e" stroke-width="2" stroke-linecap="round"/>

  <!-- neutral lips (covered when a lipstick layer is applied) -->
  <path d="M 128 212 Q 150 222 172 212 Q 150 228 128 212 Z" fill="#e0a98f"/>
</svg>
